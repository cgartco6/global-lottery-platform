name: Keep Free Tiers Awake

on:
  schedule:
    # Runs every 10 minutes to keep Render & Streamlit warm
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://global-lottery-backend.onrender.com/ping || true

      - name: Ping Streamlit Dashboard
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://share.streamlit.io || true
