name: Keep Free Tiers Awake

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: curl -s https://global-lottery-backend.onrender.com/ping || true

      - name: Ping Streamlit Dashboard
        run: curl -s https://your-streamlit-app.streamlit.app || true
