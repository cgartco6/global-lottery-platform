services:
  - type: web
    name: global-lottery-backend
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: lottery-db
    plan: free
    databaseName: lottery_db
    user: postgres
